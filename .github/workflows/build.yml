name: candidate-build

on:
  workflow_dispatch:
    inputs:
      dovecot_nvr:
        description: 'Optional assertion; must equal the structured vendor candidate (never selects an arbitrary release)'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Alma toolchain
        run: docker build -t chatmail-alma-candidate .
      - name: Validate contracts
        run: |
          docker run --rm --network none --cpus 8 --memory 12g \
            -v "$PWD:/project:ro" --entrypoint bash chatmail-alma-candidate \
            -c 'python3 -m unittest discover -s /project/tests -p "test_*.py" -v; rc=$?; exit "$rc"'
      - name: Discover and prepare a private vendor candidate
        env:
          REQUESTED_DOVECOT_NVR: ${{ inputs.dovecot_nvr }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/intake"
          docker run --rm --cpus 8 --memory 12g \
            -e "DOVECOT_NVR_ASSERTION=$REQUESTED_DOVECOT_NVR" -e ARTIFACT_DIR=/intake \
            -v "$PWD:/project:ro" -v "$RUNNER_TEMP/intake:/intake" \
            --entrypoint bash chatmail-alma-candidate /project/scripts/discover-candidate.sh
      - name: Build the exact detected candidate
        run: |
          docker run --rm --cpus 8 --memory 12g --pids-limit 1024 \
            -v "$RUNNER_TEMP/intake/source:/project:ro" -v "$RUNNER_TEMP/artifacts:/artifacts" \
            --entrypoint bash chatmail-alma-candidate \
            -c 'bash /project/scripts/check-target.sh && bash /project/scripts/entrypoint.sh'
      - name: Exercise private Lua modules and notification handoff
        run: |
          docker build --build-arg BASE=chatmail-alma-candidate \
            -f Dockerfile.lab -t chatmail-alma-runtime "$RUNNER_TEMP/artifacts"
          docker run --rm --network none --cpus 8 --memory 12g --pids-limit 1024 \
            -e CHATMAIL_ISOLATED_LAB=1 \
            -v "$RUNNER_TEMP/intake/source:/project:ro" -v "$RUNNER_TEMP/artifacts:/artifacts" \
            --entrypoint bash chatmail-alma-runtime /project/scripts/lab-test.sh
      - name: Preserve candidate and audit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatmail-alma-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/artifacts/
            ${{ runner.temp }}/intake/
          if-no-files-found: warn

# Deliberately no release job, tag trigger, write permission or production
# updater invocation. The deployed timer consumes the old dovecot-* releases;
# migration and manual promotion must precede any publication in that channel.
