name: build

on:
  workflow_dispatch:
    inputs:
      dovecot_nvr:
        description: 'Dovecot NVR to build against (e.g. dovecot-2.3.21-16.el10). Leave blank to auto-detect.'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'dovecot-*'
  pull_request:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      dovecot_nvr: ${{ steps.detect.outputs.dovecot_nvr }}
      tag: ${{ steps.detect.outputs.tag }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Detect Dovecot NVR
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.dovecot_nvr }}" ]]; then
            NVR="${{ github.event.inputs.dovecot_nvr }}"
          elif [[ "${{ github.ref }}" == refs/tags/dovecot-* ]]; then
            NVR="${{ github.ref_name }}"
            NVR="${NVR#dovecot-}"
          else
            echo "Querying AlmaLinux 10 appstream for current Dovecot version..."
            RAW=$(docker run --rm almalinux:10 bash -c \
              "dnf -q list dovecot 2>/dev/null | awk 'NR>1{print \$2}' | head -1")
            # RAW looks like "1:2.3.21-16.el10_1.1" — strip epoch
            NVR="dovecot-$(echo "${RAW}" | sed 's/^[0-9]*://')"
            echo "Detected: ${NVR}"
          fi

          TAG="dovecot-${NVR#dovecot-}"
          echo "dovecot_nvr=${NVR}" | tee -a "${GITHUB_OUTPUT}"
          echo "tag=${TAG}"         | tee -a "${GITHUB_OUTPUT}"

          # On scheduled runs, skip if a release for this exact tag already exists
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
            if [[ "${STATUS}" == "200" ]]; then
              echo "Release ${TAG} already exists — skipping."
              echo "should_build=false" | tee -a "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "should_build=true" | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: detect-version
    if: needs.detect-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          docker version

      - name: Build Docker image
        run: docker build -t dovecot-el10-lua-plugins:ci .

      - name: Build artifacts in container
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${ARTIFACTS_DIR}"

          docker run --rm \
            -e "DOVECOT_NVR=${{ needs.detect-version.outputs.dovecot_nvr }}" \
            -v "${ARTIFACTS_DIR}:/artifacts" \
            dovecot-el10-lua-plugins:ci

          sudo chown -R "$(id -u):$(id -g)" "${ARTIFACTS_DIR}"

      - name: Smoke check artifacts
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"

          echo "== artifacts =="
          find "${ARTIFACTS_DIR}" -maxdepth 4 -type f | sort

          find "${ARTIFACTS_DIR}" -name '*push_notification*plugin.so*' | grep -q . \
            || { echo "Missing push_notification plugin" >&2; exit 1; }
          find "${ARTIFACTS_DIR}" -name '*mail*lua*plugin.so*' | grep -q . \
            || { echo "Missing mail_lua plugin" >&2; exit 1; }
          find "${ARTIFACTS_DIR}" -name 'libdovecot-lua.so*' | grep -q . \
            || { echo "Missing libdovecot-lua" >&2; exit 1; }
          find "${ARTIFACTS_DIR}" -name '*.rpm' | grep -q . \
            || { echo "Missing RPM" >&2; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  release:
    needs: [detect-version, build]
    if: >
      needs.build.result == 'success' && (
        startsWith(github.ref, 'refs/tags/dovecot-') ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          body: |
            Dovecot Lua + push-notification plugins built against `${{ needs.detect-version.outputs.dovecot_nvr }}` on AlmaLinux 10.

            **Install on delta:**
            ```bash
            sudo /usr/local/bin/dovecot-upgrade.sh
            ```
          files: |
            artifacts/rpms/*.rpm
            artifacts/plugins/*.so*
